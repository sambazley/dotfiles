<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:font.dtd">
<fontconfig>
  <description>Enable OpenType features for the Inter font</description>
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Inter Display</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>ccmp on</string>
      <string>cv05 on</string>
    </edit>
  </match>
</fontconfig>

